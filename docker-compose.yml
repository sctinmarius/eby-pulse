services:
  postgres:
    image: postgres:17.6-alpine
    pull_policy: missing
    environment:
      POSTGRES_USER: ebypulse
      POSTGRES_PASSWORD: ebypulse
      POSTGRES_DB: ebypulse
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ebypulse -d ebypulse']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5433:5432'
    volumes:
      - ./.docker/postgres:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

  api:
    image: eby-pulse-api:dev
    pull_policy: missing
    build:
      context: .
      target: base
      dockerfile: Dockerfile
    command: sh -c "pnpm prisma:migrate:deploy && pnpm dev:docker"
    ports:
      - '3030:3030'
    volumes:
      - .:/app
      - /app/node_modules
    profiles:
      - dev
    env_file:
      - .env
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy

  api_prod:
    image: eby-pulse-api:prod
    pull_policy: missing
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    ports:
      - '3030:3030'
    profiles:
      - prod
    env_file:
      - .env
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
